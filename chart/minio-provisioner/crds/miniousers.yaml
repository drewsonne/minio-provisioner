apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: miniousers.minio.sonne.zone
spec:
  group: minio.sonne.zone
  scope: Namespaced
  names:
    plural: miniousers
    singular: miniouser
    kind: MinioUser
    shortNames:
      - muser
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: AccessKey
          type: string
          jsonPath: .metadata.name
        - name: Policy
          type: string
          jsonPath: .spec.policy
        - name: Ready
          type: boolean
          jsonPath: .status.create_fn.ready
        - name: Drift
          type: boolean
          jsonPath: .status.check_drift.drift
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["policy", "secretName"]
              properties:
                policy:
                  type: string
                  description: "MinIO built-in policy to attach to the user."
                  enum:
                    - readwrite
                    - readonly
                    - writeonly
                    - diagnostics
                    - consoleAdmin
                secretName:
                  type: string
                  description: "Name of the Kubernetes Secret to store access_key / secret_key in."
                  maxLength: 253
                secretNamespace:
                  type: string
                  description: "Namespace to create the credentials Secret in. Defaults to the CR's namespace."
                  maxLength: 63
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
