apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: miniobuckets.minio.sonne.zone
spec:
  group: minio.sonne.zone
  scope: Namespaced
  names:
    plural: miniobuckets
    singular: miniobucket
    kind: MinioBucket
    shortNames:
      - mbucket
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Bucket
          type: string
          jsonPath: .metadata.name
        - name: Versioning
          type: boolean
          jsonPath: .spec.versioning
        - name: Ready
          type: boolean
          jsonPath: .status.create_fn.ready
        - name: Drift
          type: boolean
          jsonPath: .status.check_drift.drift
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              properties:
                versioning:
                  type: boolean
                  description: "Whether to enable versioning on the bucket. Defaults to false."
                  default: false
                lifecycle:
                  type: array
                  description: "Lifecycle rules for the bucket (reserved for future use)."
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
